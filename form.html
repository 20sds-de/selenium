<!DOCTYPE html>
<html>
<head>
    <h2 id = "title"> Selenium Practice html file </h2>
</head>
<body>
   <h2> Fill below form details </h2>
   <form> <!-- form elements contains different types of elemetns such as text fields , checkboxes , radio buttons , submit buttons etc-->
   <label for = "fname"> First Name : </label><br>
   <input type = "text" id = "fname" name = "fame" value = "Shalini" > <br> 
   <label for = "lname"> Last Name : </label> <br>
   <input type = "text" id = "lname"  name = "lname" value = "Devarasetti"> <br> <br>
   
   <p> Choose your first language : </p>
    <input type = "radio" id = "telugu" name = "first_language" value = "Telugu">
    <label for = "telugu"> Telugu </label> <br>
    <input type = "radio" id = "hindi" name = "first_language" value = "Hindi">
    <label for = "hindi"> Hindi </label> <br>
    <input type = "radio" id = "tamil" name = "first_language" value = "Tamil">
    <label for = "tamil"> Tamil </label> <br><br>
    
     
     <h id="title">Dropdown Practice</h>

    <label for="country">Select Country:</label>
    <select id="country">
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="UK">United Kingdom</option>
        <option value="CA">Canada</option>
    </select>
    <br><br>
   <input type = "submit" id = "Submit"> <br> <br> <br>
   <!--- target specifies where to display the response after submitting the form--->
   
   </form>
</body>
</html>
