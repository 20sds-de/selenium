<!DOCTYPE html>
<html>
<body>

<h1>XPath Practice</h1>

<div id="login-box">

    <label for="user">Username</label>
    <input id="user" name="username" class="input_field" type="text" placeholder="Enter username">

    <label for="pass">Password</label>
    <input id="pass" name="password" class="input_field" type="password" placeholder="Enter password">

    <!-- Added classes so your CSS selector "button.btn.primary" works -->
    <button id="loginBtn" class="btn primary">Login</button>

</div>

<hr>

<!-- Updated link text so your LINK_TEXT locator works -->
<a href="/forgot" id="forgotLink">Forgot Password</a>

<hr>

<ul id="products">
    <li class="item" data-id="101">Backpack</li>
    <li class="item" data-id="102">Bike Light</li>

    <!-- Your XPath //li[text()='T-Shirt'] needs EXACT match -->
    <li class="item featured" data-id="103">T-Shirt</li>
</ul>

<div class="menu">
    <ul>
        <li class="nav-item active"><a href="/home">Home</a></li>
        <li class="nav-item"><a href="/products">Products</a></li>
        <li class="nav-item"><a href="/contact">Contact</a></li>
    </ul>
</div>

</body>
</html>
